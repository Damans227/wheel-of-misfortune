name: Deploy Wheel of Misfortune to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy needed files and dirs into the public/ directory
        run: |
          mkdir -p public/incidents
          for source in *.html static fellows.json; do cp -r $source public/; done
          # copy .sample fallbacks first, then real files, so a real file
          # always wins over its .sample default regardless of name sort order
          for f in incidents/*.sample; do [ -e "$f" ] && cp "$f" "public/incidents/$(basename "$f" .sample)"; done
          for f in incidents/*; do
            case "$f" in *.sample) continue ;; esac
            cp "$f" "public/incidents/$(basename "$f")"
          done
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
